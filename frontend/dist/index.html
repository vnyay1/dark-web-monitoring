<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Sentinel — ANTIC</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      Theme applique AVANT le premier affichage, pour ne jamais montrer la
      page un instant dans le mauvais theme. Meme regle que theme.jsx : choix
      memorise, sinon preference du systeme. Aucune police ni ressource
      externe : tout est embarque dans le build (VM isolee).
    -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem("sentinel-theme");
        } catch (e) {}
        if (theme !== "clair" && theme !== "sombre") {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
              ? "clair"
              : "sombre";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
